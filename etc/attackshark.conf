# Profile applied at boot by attackshark.service (attackshark --optional apply).
# One command per line, same syntax as the CLI.

# R11 Ultra
mouse rate set 2000
mouse dpi set 1 900
mouse motion-sync off
mouse angle-snap off
mouse ripple off

# R85 HE
keyboard rate 2000
keyboard light --mode wave --brightness 4 --speed 2 --color ffffff

# Travel deliberately is not applied at boot: it changes how every key feels.
# Check the current values with "attackshark keyboard travel" and only then use:
# keyboard travel --actuation 2.0 --release 2.0 --deadzone 0.3
